<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Kodex Web</title>
    <meta http-equiv="Cache-Control" content="no-cache">
    <style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }</style>
</head>
<body>
    <script>
        (() => {
            let ticket = null;
            if (/^\/web\/[0-9a-f]{64}\/$/.test(location.pathname)) {
                const key = 'kodex.frontend-capability:' + location.pathname;
                const fragment = location.hash.slice(1);
                const valid = value => /^[0-9a-f]{64}$/.test(value || '');
                if (fragment) {
                    ticket = valid(fragment) ? fragment : null;
                    try {
                        if (ticket) sessionStorage.setItem(key, ticket);
                        else sessionStorage.removeItem(key);
                    } catch {}
                } else {
                    try {
                        const saved = sessionStorage.getItem(key);
                        ticket = valid(saved) ? saved : null;
                    } catch {}
                }
                history.replaceState(null, '', location.pathname + location.search);
            }
            window.kodexTakeLaunchTicket = () => {
                const value = ticket;
                ticket = null;
                return value;
            };
        })();
    </script>
    <script type="module" src="kodex-web.js"></script>
</body>
</html>
